name: "Build API JSON Schema docs"

on:
  push:
    paths:
      - '**/validate-input.json'
      - '**/validate-output.json'
      - '**/validator-definitions.json'
      - '.github/workflows/build-apidoc.yml'

# Il workflow riutilizzabile pubblica i documenti in un ramo apidoc-*: serve la scrittura
# (nei repository nuovi il token è in sola lettura e GitHub rifiuterebbe di avviarlo)
permissions:
  contents: write

jobs:
  build-apidoc:
    uses: NethServer/ns8-github-actions/.github/workflows/build-apidoc.yml@v1
