# Controlli di sicurezza a ogni modifica e ogni lunedì.
# Le azioni vanno fissate per hash di commit: Renovate (helpers:pinGitHubActionDigests) lo fa da solo.
name: Sicurezza

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - name: Prova dei PC RustDesk (backend reale, rustdesk-api simulato)
        run: npm run build && node test/e2e-rustdesk.mjs
      - name: Prova degli aggiornamenti del client
        run: node test/e2e-client-updates.mjs

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ui/ è l'interfaccia NS8 del template (vue-cli 4): le 2 segnalazioni restanti riguardano solo la compilazione
      - name: Scansione di dipendenze, segreti e configurazioni
        run: >
          docker run --rm -v "$PWD:/src:ro" docker.io/aquasec/trivy:0.76.2
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs /src/ui /src
